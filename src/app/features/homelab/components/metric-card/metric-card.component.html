<div
  class="metric"
  [class.hot]="hot()"
  [style.--c]="color()"
  role="meter"
  aria-valuemin="0"
  aria-valuemax="100"
  [attr.aria-valuenow]="fill().toFixed(0)"
  [attr.aria-label]="label() + ' ' + value()"
>
  <div class="m-top">
    <svg class="gauge-ring" viewBox="0 0 40 40" aria-hidden="true">
      <circle class="track" cx="20" cy="20" r="16" pathLength="100" />
      <circle class="bar" cx="20" cy="20" r="16" pathLength="100" [style.stroke-dashoffset]="100 - fill()" />
    </svg>
    <div class="m-read">
      <span class="m-label">{{ label() }}</span>
      <span class="m-value">{{ value() }}</span>
      <span class="m-sub">{{ sub() }}</span>
    </div>
  </div>

  <svg class="m-spark" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true">
    <path class="area" [attr.d]="area()" />
    <path class="line" [attr.d]="line()" />
  </svg>

  @if (peak()) {
    <span class="m-peak">{{ peak() }}</span>
  }
</div>
