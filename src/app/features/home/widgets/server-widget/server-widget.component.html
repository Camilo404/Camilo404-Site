<section
  class="widget-card server-card"
  appCard3d
  [card3dConfig]="{ maxRotation: 3, scale: 1.01 }"
  [card3dSpotlight]="true"
  aria-label="Homelab server status"
>
  <app-tile-sparkles [variant]="1"></app-tile-sparkles>

  <header class="srv-header">
    <span class="tile-label">Homelab</span>
    <span class="srv-pill" [class.off]="!online()">
      <i class="srv-dot" aria-hidden="true"></i>
      @if (online()) { Online · up {{ uptime() }} } @else { Offline }
    </span>
    @if (isDemo) {
      <span class="srv-demo" tabindex="0" appTooltip="Simulated numbers until the server endpoint goes live">demo</span>
    }
  </header>

  <div class="srv-body">
    <!-- Rings -->
    <div class="srv-gauges">
      @for (g of gauges(); track g.id) {
        <div
          class="gauge"
          [class.hot]="g.hot"
          [style.--c]="g.color"
          role="meter"
          aria-valuemin="0"
          aria-valuemax="100"
          [attr.aria-valuenow]="g.fill.toFixed(0)"
          [attr.aria-label]="g.label + ' ' + g.value"
        >
          <svg class="gauge-ring" viewBox="0 0 40 40" aria-hidden="true">
            <circle class="track" cx="20" cy="20" r="16" pathLength="100" />
            <circle class="bar" cx="20" cy="20" r="16" pathLength="100" [style.stroke-dashoffset]="100 - g.fill" />
          </svg>
          <span class="g-value">{{ g.value }}</span>
          <span class="g-label">{{ g.label }}</span>
          <span class="g-sub">{{ g.sub }}</span>
        </div>
      } @empty {
        @for (i of [0, 1, 2, 3]; track i) {
          <div class="gauge is-skeleton" aria-hidden="true"><span class="sk-ring"></span></div>
        }
      }
    </div>

    <!-- Network -->
    <div class="srv-net">
      <div class="net-rates">
        <span class="net-rate down"><i aria-hidden="true">↓</i>{{ downRate() }}</span>
        <span class="net-rate up"><i aria-hidden="true">↑</i>{{ upRate() }}</span>
      </div>
      <svg class="spark" viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="srvDownFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#b79cf7" stop-opacity="0.55" />
            <stop offset="100%" stop-color="#b79cf7" stop-opacity="0" />
          </linearGradient>
        </defs>
        <path class="down-area" [attr.d]="downArea()" fill="url(#srvDownFill)" />
        <path class="down-line" [attr.d]="downLine()" />
        <path class="up-line" [attr.d]="upLine()" />
      </svg>
      <span class="net-caption">Network · last minute</span>
    </div>
  </div>
</section>
