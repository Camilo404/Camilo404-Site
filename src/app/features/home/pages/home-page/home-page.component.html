<!-- Sparkle burst on click -->
<app-click-sparkles></app-click-sparkles>

<!-- ⌘K / Ctrl+K / "/" -->
<app-command-palette [commands]="commands()"></app-command-palette>

<main class="main-container">
  <!-- Bento: tile size follows importance (see grid-template-areas in the SCSS) -->
  <div class="bento" [class.no-intro]="skipIntro">

    <div class="tile tile-profile" style="--i: 0">
      <app-card-profile (themeColorsChange)="onThemeColorsChange($event)"></app-card-profile>
    </div>

    <div class="tile tile-clock" style="--i: 1">
      <app-clock-widget></app-clock-widget>
    </div>

    <div class="tile tile-music" style="--i: 2">
      <app-now-playing-widget></app-now-playing-widget>
    </div>

    <div class="tile tile-shadow" style="--i: 3">
      <app-shadow-widget></app-shadow-widget>
    </div>

    <!-- Connect + Homelab summary share one cell; the full stats live at /homelab -->
    <div class="tile-duo">
      <div class="tile tile-social" style="--i: 4">
        <app-social-widget></app-social-widget>
      </div>
      <div class="tile tile-lab" style="--i: 5">
        <app-homelab-mini-widget></app-homelab-mini-widget>
      </div>
    </div>

    <div class="tile tile-stack" style="--i: 6">
      <app-tech-stack-widget></app-tech-stack-widget>
    </div>

  </div>

  <footer class="site-footer">
    <span>© {{ year }} Camilo404</span>
    <span class="dot" aria-hidden="true">✦</span>
    <span>Made with love in Medellín</span>
    <span class="dot" aria-hidden="true">✦</span>
    <button type="button" class="palette-hint" (click)="palette()?.open()" aria-label="Open command palette">
      <kbd>{{ isMac ? '⌘' : 'Ctrl' }}</kbd><kbd>K</kbd>
    </button>
  </footer>
</main>
